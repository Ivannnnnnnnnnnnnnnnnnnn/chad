<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#E30613">
    <title>Starlink chad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">
    <link rel="stylesheet" href="/static/css/brand.css">
</head>
<body class="bg-gray-50 text-gray-900 antialiased" data-active="{{active}}">

<header class="bg-black text-white">
    <div class="max-w-lg mx-auto px-4 py-4 flex items-center justify-between">
        <a href="/plans/" class="flex items-baseline gap-2">
            <span class="font-extrabold tracking-tight text-xl">STARLINK</span>
            <span class="text-xs text-gray-400">chad Revendeur</span>
        </a>
        <nav class="flex items-center gap-3 text-sm">
            <a href="/plans/" class="text-gray-300 hover:text-white flex items-center gap-1"><i class="uil uil-sim-card"></i><span class="hidden sm:inline">Forfaits</span></a>
            <a href="/statut/" class="text-gray-300 hover:text-white flex items-center gap-1"><i class="uil uil-wifi"></i><span class="hidden sm:inline">Statut</span></a>
        </nav>
    </div>
</header>

<main class="max-w-lg mx-auto px-4 pb-24 pt-6">
{{content}}
</main>

<footer class="max-w-lg mx-auto px-4 py-8 text-center text-xs text-gray-400">
    <p>Payez en toute sécurité avec AIRTEL MONEY ou MOOV MONEY.</p>
    <p class="mt-1">Support : support@starlinkchad.reseller</p>
</footer>

<nav class="fixed bottom-0 inset-x-0 bg-white border-t border-gray-200">
    <div class="max-w-lg mx-auto grid grid-cols-3 py-2 text-xs text-gray-500">
        <a href="/plans/" class="flex flex-col items-center gap-1"><i class="uil uil-sim-card text-lg"></i>Forfaits</a>
        <a href="/statut/" class="flex flex-col items-center gap-1"><i class="uil uil-wifi text-lg"></i>Statut</a>
        <a href="/settings/" class="flex flex-col items-center gap-1"><i class="uil uil-setting text-lg"></i>Paramètres</a>
    </div>
</nav>

<script src="/static/js/app.js" defer></script>
{{scripts}}
</body>
</html>
