<section class="bg-white rounded-2xl border border-gray-100 p-6 sm:p-8 mt-4 text-center">
    <div class="h-20 w-20 mx-auto mb-4 rounded-full bg-green-100 flex items-center justify-center">
        <i class="uil uil-check text-green-600 text-4xl"></i>
    </div>
    <h1 class="text-2xl font-bold text-black mb-1">Paiement approuvé</h1>
    <p class="text-gray-600 text-sm">Votre forfait est activé. Merci de votre confiance.</p>

    <div class="bg-gray-50 rounded-2xl border border-gray-100 p-4 mt-6 text-sm space-y-2 text-left">
        <div class="flex justify-between"><span class="text-gray-500">Référence</span><span class="font-bold text-black">{{order.reference}}</span></div>
        <div class="flex justify-between"><span class="text-gray-500">Forfait</span><span class="font-bold text-black">{{order.planName}}</span></div>
        <div class="flex justify-between"><span class="text-gray-500">Montant</span><span class="font-bold text-black">XAF {{order.amount}}</span></div>
    </div>

    <a href="/plans/" class="block text-center mt-6 airtel-red-bg text-white font-bold py-4 rounded-full">Retour aux forfaits</a>
</section>
